<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Pannello HMI - ITT Meccatronica</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #38bdf8;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .status-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .indicator {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: #ef4444;
            box-shadow: 0 0 10px #ef4444;
            transition: all 0.3s ease;
        }
        .indicator.active {
            background-color: #22c55e;
            box-shadow: 0 0 15px #22c55e;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-start {
            background-color: #22c55e;
            color: white;
        }
        .btn-stop {
            background-color: #ef4444;
            color: white;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Pannello Test HMI</h1>
        <div class="subtitle">Verifica funzionamento GitHub Pages</div>

        <div class="status-box">
            <span>Stato Sistema:</span>
            <span id="statusText" style="font-weight: bold; color: #ef4444;">FERMO</span>
            <div id="statusIndicator" class="indicator"></div>
        </div>

        <div class="controls">
            <button class="btn-start" onclick="cambiaStato('ON')">AVVIA</button>
            <button class="btn-stop" onclick="cambiaStato('OFF')">ARRESTA</button>
        </div>
    </div>

    <script>
        function cambiaStato(stato) {
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');

            if (stato === 'ON') {
                indicator.classList.add('active');
                statusText.innerText = 'ATTIVO';
                statusText.style.color = '#22c55e';
            } else {
                indicator.classList.remove('active');
                statusText.innerText = 'FERMO';
                statusText.style.color = '#ef4444';
            }
        }
    </script>

</body>
</html>
