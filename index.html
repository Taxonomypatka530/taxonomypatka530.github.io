<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITT Meccatronica Mazara - Supervisione HMI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #3b82f6;
        }
        header h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        header p {
            font-size: 0.95rem;
            color: #94a3b8;
        }
        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .card-title {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 25px;
            color: #f1f5f9;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
        }
        .status-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f172a;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }
        .status-label {
            font-weight: 600;
            color: #cbd5e1;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            color: #22c55e;
        }
        .led {
            width: 14px;
            height: 14px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn {
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .btn-start {
            background-color: #10b981;
            color: white;
        }
        .btn-start:hover {
            background-color: #059669;
            transform: translateY(-2px);
        }
        .btn-stop {
            background-color: #ef4444;
            color: white;
        }
        .btn-stop:hover {
            background-color: dc2626;
            transform: translateY(-2px);
        }
        footer {
            text-align: center;
            padding: 15px;
            background-color: #1e293b;
            color: #64748b;
            font-size: 0.85rem;
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body>

    <header>
        <h1>ITT Meccatronica Mazara</h1>
        <p>Laboratorio di Automazione e Robotica - Supervisione HMI</p>
    </header>

    <div class="container">
        <div class="card">
            <div class="card-title">Pannello Controllo Impianto</div>
            
            <div class="status-box">
                <span class="status-label">Stato Sistema:</span>
                <div class="status-indicator">
                    <span id="textStatus">ATTIVO</span>
                    <div class="led" id="ledStatus"></div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-start" onclick="inviaComando('AVVIA')">AVVIA</button>
                <button class="btn btn-stop" onclick="inviaComando('ARRESTA')">ARRESTA</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 ITT Meccatronica Mazara - GitHub Pages HMI
    </footer>

    <script>
        function inviaComando(azione) {
            const textStatus = document.getElementById('textStatus');
            const ledStatus = document.getElementById('ledStatus');
            
            if (azione === 'AVVIA') {
                textStatus.textContent = 'ATTIVO';
                textStatus.style.color = '#22c55e';
                ledStatus.style.backgroundColor = '#22c55e';
                ledStatus.style.boxShadow = '0 0 10px #22c55e';
                alert('Comando inviato: AVVIO impianto.');
            } else {
                textStatus.textContent = 'ARRESTATO';
                textStatus.style.color = '#ef4444';
                ledStatus.style.backgroundColor = '#ef4444';
                ledStatus.style.boxShadow = '0 0 10px #ef4444';
                alert('Comando inviato: ARRESTO impianto.');
            }
        }
    </script>
</body>
</html>
